<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тёмные Карты — квиз-битва против Босса</title>
<style>
/* ============================================================
   ТЁМНЫЕ КАРТЫ — квиз-битва (всё в одном файле, работает офлайн)
   Стиль: dark fantasy — чёрно-фиолетовый туман, золото и рубин
   ============================================================ */
:root{
  --bg:#0b0710;
  --panel:#1a1226;
  --panel-2:#241a33;
  --edge:#4a3a68;
  --gold:#e8c268;
  --gold-bright:#f6dfa0;
  --ruby:#d43f3f;
  --ruby-dark:#7e2222;
  --emerald:#4ade80;
  --amber:#f0b429;
  --silver:#d7dce5;
  --violet:#a78bfa;
  --muted:#9b8fb0;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Segoe UI', Tahoma, Arial, sans-serif;
  color:var(--silver);
  font-size:17px;
  background:
    radial-gradient(ellipse at 18% -10%, rgba(109,40,217,.20), transparent 55%),
    radial-gradient(ellipse at 85% 115%, rgba(127,29,29,.18), transparent 55%),
    radial-gradient(ellipse at 50% 45%, #181122 0%, #0b0710 75%);
  min-height:100vh;
  overflow-x:hidden;
}
h1,h2,h3,.serif{font-family:Georgia,'Palatino Linotype','Times New Roman',serif;}
.hidden{display:none !important;}

/* ---------- Общая карта ---------- */
.card{
  background:linear-gradient(165deg,#241a33 0%,#1a1226 55%,#140e1d 100%);
  border:2px solid var(--edge);
  border-radius:16px;
  color:var(--silver);
  box-shadow:inset 0 0 26px rgba(0,0,0,.55), 0 10px 24px rgba(0,0,0,.5);
  position:relative;
}

/* ---------- Экран настройки ---------- */
#screen-setup{
  min-height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:34px; padding:30px 18px;
}
.nickname-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; width:100%; max-width:660px;}
.nick-slot{display:flex; align-items:center; gap:14px;}
.nick-slot input{
  flex:1; min-width:0;
  background:#140e1d; border:2px solid var(--edge); border-radius:13px;
  padding:15px 16px; font-size:19px; font-weight:600; color:var(--gold-bright);
  text-align:center; outline:none; box-shadow:inset 0 3px 8px rgba(0,0,0,.6);
}
.nick-slot input:focus{border-color:var(--gold); box-shadow:0 0 16px rgba(232,194,104,.4);}
.avatar{
  flex:none; width:56px; height:56px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:30px;
  border:2px solid var(--edge); box-shadow:inset 0 0 14px rgba(0,0,0,.5), 0 4px 10px rgba(0,0,0,.5);
  background:var(--panel-2);
}
.avatar-sm{flex:none; width:32px; height:32px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:18px; background:rgba(0,0,0,.45); border:1px solid var(--edge);}
.btn{
  display:inline-block; cursor:pointer; user-select:none;
  font-family:Georgia,serif; font-weight:700; letter-spacing:.8px;
  background:linear-gradient(180deg,#3a2a52,#241a33);
  color:var(--gold-bright); border:2px solid var(--gold); border-radius:14px;
  padding:15px 36px; font-size:20px;
  box-shadow:0 0 14px rgba(232,194,104,.18), 0 8px 18px rgba(0,0,0,.55);
  transition:transform .08s, box-shadow .18s, filter .15s;
}
.btn:hover{box-shadow:0 0 26px rgba(232,194,104,.5), 0 8px 18px rgba(0,0,0,.55); filter:brightness(1.1);}
.btn:active{transform:translateY(3px);}
.btn-ruby{
  background:linear-gradient(180deg,#8e2222,#5a1515);
  color:#ffd9d9; border-color:var(--ruby);
  box-shadow:0 0 16px rgba(212,63,63,.3), 0 8px 18px rgba(0,0,0,.55);
}
.btn-ruby:hover{box-shadow:0 0 30px rgba(212,63,63,.6), 0 8px 18px rgba(0,0,0,.55);}
.btn-big{font-size:24px; padding:18px 56px;}

/* ---------- Игровой экран ---------- */
#screen-game{max-width:1280px; margin:0 auto; padding:18px 16px 80px;}
#topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:14px; flex-wrap:wrap;}
#chapter{font-size:32px; color:var(--gold); text-shadow:0 0 16px rgba(232,194,104,.4); letter-spacing:2px; flex:1; text-align:center;}
#round-label{font-size:18px; color:var(--violet); font-weight:600;}
#mute-btn{background:var(--panel); border:2px solid var(--edge); color:var(--silver); border-radius:12px; padding:9px 16px; cursor:pointer; font-size:16px;}
#mute-btn:hover{border-color:var(--gold); color:var(--gold-bright);}

/* --- Арена: босс / дуэль --- */
#arena{display:flex; justify-content:center; align-items:stretch; gap:22px; margin:10px 0 16px; flex-wrap:wrap;}
.arena-card{width:380px; padding:18px 20px; text-align:center;}
.shake{animation:shake .5s;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  15%{transform:translateX(-12px) rotate(-2deg);} 30%{transform:translateX(11px) rotate(2deg);}
  45%{transform:translateX(-9px);} 60%{transform:translateX(8px);} 80%{transform:translateX(-4px);}
}
.boss-emoji{font-size:78px; line-height:1; filter:drop-shadow(0 6px 10px rgba(0,0,0,.7));}
.boss-name{font-size:25px; margin:10px 0 4px; color:var(--ruby); text-shadow:0 0 12px rgba(212,63,63,.5); letter-spacing:1px;}
.duel-side{width:320px;}
.duel-side .who{font-size:23px; font-weight:700; color:var(--gold-bright); margin:6px 0; display:flex; align-items:center; justify-content:center; gap:10px;}
.duel-side .role{font-size:14px; color:var(--violet); letter-spacing:2px;}
.duel-avatar{width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:34px; background:rgba(0,0,0,.45); border:2px solid var(--edge); margin:0 auto;}
.duel-arrow{display:flex; align-items:center; justify-content:center; font-size:48px; animation:pulseArrow 1.1s infinite; text-shadow:0 0 20px rgba(212,63,63,.7);}
@keyframes pulseArrow{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}

/* --- HP бар --- */
.hp-wrap{margin-top:10px;}
.hp-bar{
  height:26px; border-radius:13px; border:2px solid var(--edge);
  background:#100b18; overflow:hidden; position:relative;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.7);
}
.hp-fill{
  height:100%; width:100%;
  background:linear-gradient(180deg,#6ee7a0,#2e8b3d);
  transition:width .6s cubic-bezier(.2,.8,.3,1);
}
.hp-fill.low{background:linear-gradient(180deg,#f6c35c,#c96a1e);}
.hp-fill.crit{background:linear-gradient(180deg,#f0705c,#a3261e);}
.hp-text{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:#fff; text-shadow:0 1px 3px #000; letter-spacing:.5px;}
.small .hp-bar{height:16px;} .small .hp-text{font-size:13px;}

/* --- Стол с картами тем --- */
#table-label{text-align:center; font-size:21px; color:var(--silver); margin:8px 0 14px;}
#table-label b{color:var(--gold);}
#topic-table{display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin-bottom:22px;}
.topic-card{
  width:170px; height:210px; padding:12px 10px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center;
  outline:1px solid rgba(232,194,104,.35); outline-offset:-7px;
  background:
    radial-gradient(circle at 50% 0%, rgba(167,139,250,.13), transparent 65%),
    linear-gradient(165deg,#241a33,#171021);
  transition:transform .18s, box-shadow .18s, border-color .18s;
  animation:dealIn .5s backwards;
}
.topic-card:nth-child(2){animation-delay:.07s;} .topic-card:nth-child(3){animation-delay:.14s;}
.topic-card:nth-child(4){animation-delay:.21s;} .topic-card:nth-child(5){animation-delay:.28s;}
@keyframes dealIn{from{transform:translateY(-60px) rotate(-8deg); opacity:0;} to{transform:none; opacity:1;}}
.topic-card:hover{
  transform:translateY(-12px) scale(1.05);
  border-color:var(--gold);
  box-shadow:inset 0 0 26px rgba(0,0,0,.55), 0 0 30px rgba(232,194,104,.4), 0 18px 30px rgba(0,0,0,.6);
}
.topic-card .t-emoji{font-size:50px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.7));}
.topic-card .t-name{font-family:Georgia,serif; font-weight:700; font-size:17px; color:var(--gold); line-height:1.2;}
.topic-card .t-left{font-size:13px; color:var(--muted);}
.topic-card.empty{opacity:.3; pointer-events:none; filter:grayscale(1);}

/* --- Сетка игроков --- */
#players-grid{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:14px; max-width:1180px; margin:0 auto;}
@media (max-width:1080px){#players-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
.player-card{padding:12px 14px; transition:box-shadow .2s, transform .2s;}
.player-card.active{border-color:var(--gold); box-shadow:inset 0 0 26px rgba(0,0,0,.55), 0 0 26px rgba(232,194,104,.55); transform:translateY(-4px);}
.player-card.dead{filter:grayscale(.9) brightness(.6);}
.player-card.dead::before{
  content:"☠"; position:absolute; top:6px; right:10px; font-size:24px; color:var(--ruby); z-index:2;
  text-shadow:0 0 8px rgba(212,63,63,.7);
}
.p-head{display:flex; align-items:center; gap:9px;}
.p-name{font-family:Georgia,serif; font-weight:700; font-size:20px; color:var(--gold-bright); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.p-stats{display:flex; justify-content:space-between; font-size:14px; color:var(--muted); margin-top:6px;}
.p-stats b{color:var(--silver);}
.p-queue{position:absolute; top:-11px; left:-8px; background:var(--panel-2); border:1px solid var(--gold); color:var(--gold-bright); font-size:12px; font-weight:700; border-radius:10px; padding:3px 9px; box-shadow:0 3px 8px rgba(0,0,0,.6);}
.p-damage-pop{position:fixed; z-index:30; font-weight:800; font-size:26px; pointer-events:none; text-shadow:0 2px 4px #000; animation:floatUp 1.3s forwards;}
@keyframes floatUp{0%{opacity:0; transform:translateY(6px) scale(.7);} 15%{opacity:1; transform:translateY(0) scale(1.15);} 100%{opacity:0; transform:translateY(-52px) scale(1);}}
.dmg-red{color:#ff5347;} .dmg-green{color:#5ce06b;} .dmg-gold{color:var(--gold);}

/* ---------- Модалка вопроса ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(5,3,8,.78); backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:14px;
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.overlay.show{opacity:1; pointer-events:auto;}
.q-card{
  width:min(1000px, 97vw); max-height:94vh; overflow:auto; padding:30px 42px 36px;
  border-color:var(--gold);
  transform:rotateY(80deg) scale(.8); transition:transform .35s;
}
.overlay.show .q-card{transform:none;}
.q-card.mega{
  border-color:var(--ruby);
  box-shadow:inset 0 0 26px rgba(0,0,0,.55), 0 0 44px rgba(212,63,63,.65);
  animation:megaGlow 1.2s infinite alternate;
}
@keyframes megaGlow{from{box-shadow:inset 0 0 26px rgba(0,0,0,.55), 0 0 26px rgba(212,63,63,.5);} to{box-shadow:inset 0 0 26px rgba(0,0,0,.55), 0 0 56px rgba(212,63,63,.85);}}
.q-head{display:flex; justify-content:space-between; align-items:center; gap:16px; border-bottom:1px solid var(--edge); padding-bottom:14px;}
.q-topic{font-family:Georgia,serif; font-weight:700; font-size:24px; color:var(--violet);}
.q-for{font-size:19px; color:var(--silver); margin-top:5px; text-align:left;}
.q-for b{color:var(--gold);}
.q-right{display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
.q-diff{font-size:26px; letter-spacing:2px; color:var(--gold); white-space:nowrap;}
.q-diff .dmg-note{font-size:16px; color:var(--muted); letter-spacing:0;}
.q-timer{
  font-family:Georgia,serif; font-size:46px; font-weight:700; line-height:1;
  color:var(--silver); text-shadow:0 0 14px rgba(215,220,229,.35);
}
.q-timer.low{color:var(--ruby); text-shadow:0 0 18px rgba(212,63,63,.8); animation:timerPulse .5s infinite alternate;}
@keyframes timerPulse{from{transform:scale(1);} to{transform:scale(1.12);}}
.q-timer-label{font-size:12px; color:var(--muted); letter-spacing:2px;}
.q-mega-label{
  font-family:Georgia,serif; font-size:30px; font-weight:700; color:#ff6b5e;
  text-shadow:0 0 14px rgba(212,63,63,.8); letter-spacing:2px; text-align:center; margin-top:12px;
  animation:megaPulse 1s infinite alternate;
}
@keyframes megaPulse{from{transform:scale(1);} to{transform:scale(1.06);}}
.q-text{font-family:Georgia,serif; font-size:30px; line-height:1.45; margin:24px 6px; color:var(--silver); text-align:center;}
.q-opts{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:680px){.q-opts{grid-template-columns:1fr;}}
.q-opt{
  cursor:pointer; text-align:left; font-size:20px; font-weight:600; color:var(--silver);
  background:linear-gradient(165deg,#241a33,#171021);
  border:2px solid var(--edge); border-radius:14px; padding:18px 16px;
  display:flex; gap:13px; align-items:center;
  transition:transform .1s, border-color .15s, box-shadow .15s;
}
.q-opt:hover{border-color:var(--gold); box-shadow:0 0 16px rgba(232,194,104,.35); transform:translateY(-2px);}
.q-opt .letter{
  flex:0 0 34px; height:34px; border-radius:10px; background:var(--panel-2);
  border:1px solid var(--violet); color:var(--violet);
  display:flex; align-items:center; justify-content:center; font-family:Georgia,serif; font-weight:700; font-size:19px;
}
.q-opt.correct{border-color:var(--emerald); background:linear-gradient(165deg,#14301f,#0e2418); box-shadow:0 0 18px rgba(74,222,128,.4);}
.q-opt.correct .letter{border-color:var(--emerald); color:var(--emerald);}
.q-opt.wrong{border-color:var(--ruby); background:linear-gradient(165deg,#331315,#240e10); box-shadow:0 0 18px rgba(212,63,63,.4);}
.q-opt.wrong .letter{border-color:var(--ruby); color:#ff8a80;}
.q-opt.disabled{pointer-events:none; opacity:.85;}
.q-actions{margin-top:22px; text-align:center;}

/* ---------- Тост ---------- */
#toast{
  position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-140%);
  background:linear-gradient(165deg,#241a33,#140e1d); color:var(--silver);
  border:2px solid var(--gold); border-radius:16px; padding:16px 34px;
  font-family:Georgia,serif; font-size:21px; z-index:200; text-align:center;
  box-shadow:0 0 26px rgba(232,194,104,.3), 0 12px 28px rgba(0,0,0,.7); transition:transform .35s;
  max-width:92vw;
}
#toast.show{transform:translateX(-50%) translateY(0);}
#toast .t-bad{color:#ff8a80;} #toast .t-good{color:var(--emerald);} #toast .t-gold{color:var(--gold);}

/* ---------- Экран итогов ---------- */
#screen-results{max-width:1060px; margin:0 auto; padding:36px 16px 70px;}
#results-title{text-align:center; font-size:44px; color:var(--gold); text-shadow:0 0 22px rgba(232,194,104,.5);}
#results-sub{text-align:center; color:var(--violet); margin:10px 0 30px; font-size:19px;}
#results-sub:empty{display:none;}
.podium{display:flex; justify-content:center; gap:20px; margin-bottom:32px; flex-wrap:wrap;}
.podium .card{width:250px; padding:20px; text-align:center; border-color:var(--gold);}
.podium .medal{font-size:48px;}
.podium .p-nick{font-family:Georgia,serif; font-weight:700; font-size:23px; color:var(--gold-bright); margin:6px 0;}
.podium .p-pts{font-size:16px; color:var(--silver); font-weight:700;}
table.stats{width:100%; border-collapse:collapse; font-size:16px;}
table.stats th, table.stats td{padding:12px 9px; text-align:center; border-bottom:1px solid rgba(74,58,104,.6);}
table.stats th{font-family:Georgia,serif; color:var(--gold); font-size:15px; background:rgba(0,0,0,.45); position:sticky; top:0; letter-spacing:.5px;}
table.stats tr.dead-row{opacity:.62;}
table.stats td.name{text-align:left; font-weight:700; color:var(--gold-bright);}
table.stats td.place{font-weight:800; font-family:Georgia,serif; color:var(--silver); font-size:19px;}
.table-wrap{background:rgba(0,0,0,.4); border:1px solid var(--edge); border-radius:16px; overflow:auto;}
.badge-boss{background:rgba(232,194,104,.15); border:1px solid var(--gold); color:var(--gold); border-radius:9px; padding:2px 9px; font-size:13px; font-weight:700;}
.results-actions{text-align:center; margin-top:32px;}
</style>
</head>
<body>

<!-- ================= ЭКРАН НАСТРОЙКИ ================= -->
<div id="screen-setup">
  <div class="nickname-grid" id="nick-grid"></div>
  <button class="btn btn-ruby btn-big" id="start-btn">⚔ Начать битву</button>
</div>

<!-- ================= ИГРОВОЙ ЭКРАН ================= -->
<div id="screen-game" class="hidden">
  <div id="topbar">
    <div id="chapter">ГЛАВА I · БИТВА С БОССОМ</div>
    <div id="round-label"></div>
    <button id="mute-btn" title="Звук">🔊 Звук</button>
  </div>

  <div id="arena">
    <!-- Босс (глава I) -->
    <div id="boss-zone" class="card arena-card">
      <div class="boss-emoji" id="boss-emoji">👹</div>
      <div class="boss-name" id="boss-name">ТЁМНЫЙ ВЛАДЫКА</div>
      <div class="hp-wrap">
        <div class="hp-bar"><div class="hp-fill" id="boss-hp-fill"></div><div class="hp-text" id="boss-hp-text"></div></div>
      </div>
    </div>

    <!-- Дуэль (глава II) -->
    <div id="duel-zone" class="hidden" style="display:flex; gap:18px; align-items:stretch;">
      <div class="card arena-card duel-side">
        <div class="role">АТАКУЕТ</div>
        <div class="duel-avatar" id="attacker-avatar">🗡️</div>
        <div class="who" id="attacker-name">—</div>
        <div class="hp-wrap small"><div class="hp-bar"><div class="hp-fill" id="attacker-hp-fill"></div><div class="hp-text" id="attacker-hp-text"></div></div></div>
      </div>
      <div class="duel-arrow">⚔️</div>
      <div class="card arena-card duel-side">
        <div class="role">ЦЕЛЬ</div>
        <div class="duel-avatar" id="target-avatar">🎯</div>
        <div class="who" id="target-name">—</div>
        <div class="hp-wrap small"><div class="hp-bar"><div class="hp-fill" id="target-hp-fill"></div><div class="hp-text" id="target-hp-text"></div></div></div>
      </div>
    </div>
  </div>

  <div id="table-label"></div>
  <div id="topic-table"></div>
  <div id="players-grid"></div>
</div>

<!-- ================= МОДАЛКА ВОПРОСА ================= -->
<div class="overlay" id="q-overlay">
  <div class="card q-card" id="q-card">
    <div class="q-head">
      <div>
        <div class="q-topic" id="q-topic">Тема</div>
        <div class="q-for" id="q-for" style="text-align:left;">Отвечает: —</div>
      </div>
      <div class="q-right">
        <div class="q-diff" id="q-diff">★</div>
        <div class="q-timer hidden" id="q-timer">15</div>
        <div class="q-timer-label hidden" id="q-timer-label">СЕКУНД</div>
      </div>
    </div>
    <div id="q-mega-label" class="q-mega-label hidden">🔥 МЕГАВОПРОС 🔥</div>
    <div class="q-text" id="q-text"></div>
    <div class="q-opts" id="q-opts"></div>
    <div class="q-actions">
      <button class="btn hidden" id="q-next">Следующий ход ▶</button>
    </div>
  </div>
</div>

<!-- ================= МОДАЛКА СОБЫТИЙ ================= -->
<div class="overlay" id="banner-overlay">
  <div class="card q-card" style="text-align:center; border-color:var(--gold);">
    <div style="font-size:66px;" id="banner-emoji">🏆</div>
    <h2 style="font-size:30px; color:var(--gold); margin:10px 0; text-shadow:0 0 14px rgba(232,194,104,.45);" id="banner-title"></h2>
    <div style="font-size:19px; line-height:1.6;" id="banner-text"></div>
    <div class="q-actions"><button class="btn" id="banner-btn">Дальше</button></div>
  </div>
</div>

<!-- ================= ЭКРАН ИТОГОВ ================= -->
<div id="screen-results" class="hidden">
  <div id="results-title">ИГРА ОКОНЧЕНА</div>
  <div id="results-sub"></div>
  <div class="podium" id="podium"></div>
  <div class="table-wrap"><table class="stats" id="stats-table"></table></div>
  <div class="results-actions"><button class="btn btn-ruby btn-big" id="again-btn">⟲ Новая игра</button></div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   НАСТРАИВАЕМЫЕ КОНСТАНТЫ (легко поменять баланс)
   ============================================================ */

   СОСТОЯНИЕ ИГРЫ
   ============================================================ */
let state = null;
let muted = false;

function newGame(names){
  const avOrder = shuffle(AVATARS.map((a,i)=>i)); // аватарки рандомно игрокам
  const players = names.map((n,i)=>({
    id:i, name:n, hp:START_HP, alive:true,
    avatar:AVATARS[avOrder[i]],
    dmgBoss:0, dmgDealt:0, dmgTaken:0,
    correct:0, answers:0,
    killedBy:null, eliminatedIn:null, points:0
  }));
  state = {
    phase:"boss",              // boss | pvp | end
    round:1,
    players,
    boss:{hp:BOSS_HP, maxHp:BOSS_HP},
    bossKiller:null,
    queue:[], queuePos:0,
    current:null,              // {attackerIdx, targetIdx|null, mega, answerIdx, q, answered}
    pools:TOPICS.map(t=>makePool(t.questions.length)),
    megaUsed:false,
    finishReason:null
  };
  newRound();
}

function makePool(n){
  const arr = [...Array(n).keys()];
  return {order:shuffle(arr), pos:0};
}
function drawQuestion(topicIdx){
  const pool = state.pools[topicIdx];
  if(pool.pos >= pool.order.length) return null;   // колода пуста
  const qIdx = pool.order[pool.pos++];
  return {q:TOPICS[topicIdx].questions[qIdx], topicIdx};
}
function allDecksEmpty(){
  return TOPICS.every((t,i)=> state.pools[i].pos >= state.pools[i].order.length);
}
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
const alivePlayers = ()=>state.players.filter(p=>p.alive);

function newRound(){
  state.queue = shuffle(alivePlayers().map(p=>p.id));
  state.queuePos = 0;
}

/* ============================================================
   ЗВУК (WebAudio, без внешних файлов)
   ============================================================ */
let audioCtx = null;
function tone(freq, dur, type="sine", vol=0.15, delay=0){
  if(muted) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const t = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }catch(e){}
}
const sfx = {
  flip:()=>tone(660,.08,"triangle",.12),
  correct:()=>{tone(523,.12,"sine",.18); tone(784,.18,"sine",.18,.1);},
  wrong:()=>{tone(160,.3,"sawtooth",.16); tone(110,.35,"sawtooth",.16,.08);},
  hit:()=>tone(90,.18,"square",.2),
  mega:()=>{[220,180,140,100].forEach((f,i)=>tone(f,.25,"sawtooth",.2,i*.09));},
  tick:()=>tone(880,.05,"square",.06),
  die:()=>{tone(300,.2,"sawtooth",.18); tone(180,.3,"sawtooth",.18,.15); tone(90,.5,"sawtooth",.18,.3);},
  win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.22,"sine",.2,i*.14));}
};

/* ============================================================
   РЕНДЕР
   ============================================================ */
const $ = id=>document.getElementById(id);
const hpClass = frac => frac<=0.25 ? "crit" : frac<=0.5 ? "low" : "";
function setHpBar(fillEl, textEl, hp, maxHp){
  const frac = Math.max(0, hp)/maxHp;
  fillEl.style.width = (frac*100).toFixed(1)+"%";
  fillEl.className = "hp-fill " + hpClass(frac);
  textEl.textContent = Math.max(0,hp) + " / " + maxHp + " HP";
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function renderTopbar(){
  $("chapter").textContent = state.phase==="boss" ? "ГЛАВА I · БИТВА С БОССОМ" : "ГЛАВА II · БИТВА ИГРОКОВ";
  $("round-label").textContent = "Круг " + state.round + " · в живых: " + alivePlayers().length;
}

function renderBossZone(){
  setHpBar($("boss-hp-fill"), $("boss-hp-text"), state.boss.hp, state.boss.maxHp);
}

function renderDuelZone(){
  if(!state.current || state.phase!=="pvp") return;
  const at = state.players[state.current.attackerIdx];
  const tg = state.players[state.current.targetIdx];
  $("attacker-name").textContent = at.name;
  $("attacker-avatar").textContent = at.avatar.emoji;
  setHpBar($("attacker-hp-fill"), $("attacker-hp-text"), at.hp, START_HP);
  $("target-name").textContent = tg.name;
  $("target-avatar").textContent = tg.avatar.emoji;
  setHpBar($("target-hp-fill"), $("target-hp-text"), tg.hp, START_HP);
}

function renderTable(){
  const wrap = $("topic-table");
  wrap.innerHTML = "";
  TOPICS.forEach((t,i)=>{
    const left = state.pools[i].order.length - state.pools[i].pos;
    const div = document.createElement("div");
    div.className = "card topic-card" + (left<=0 ? " empty" : "");
    div.innerHTML = '<div class="t-emoji">'+t.emoji+'</div><div class="t-name">'+esc(t.name)+'</div>';
    div.onclick = ()=>pickTopic(i);
    wrap.appendChild(div);
  });
  const cur = state.players[state.current.attackerIdx];
  if(state.phase==="pvp"){
    const tg = state.players[state.current.targetIdx];
    $("table-label").innerHTML = "<b>"+esc(cur.name)+"</b> ⚔ <b>"+esc(tg.name)+"</b>";
  }else{
    $("table-label").innerHTML = "Ходит <b>"+esc(cur.name)+"</b>";
  }
}

function renderPlayers(){
  const grid = $("players-grid");
  grid.innerHTML = "";
  state.players.forEach((p,i)=>{
    const div = document.createElement("div");
    div.className = "card player-card" + (p.alive ? "" : " dead") + (state.current && state.current.attackerIdx===i ? " active" : "");
    const qPos = state.queue.indexOf(i);
    const isCurrent = state.current && state.current.attackerIdx===i;
    const badge = (p.alive && !isCurrent && qPos>=state.queuePos) ? '<div class="p-queue">'+(qPos - state.queuePos + 1)+'</div>' : "";
    div.innerHTML = badge +
      '<div class="p-head"><span class="avatar-sm" title="'+esc(p.avatar.name)+'">'+p.avatar.emoji+'</span><div class="p-name">'+esc(p.name)+'</div></div>'+
      '<div class="hp-wrap small"><div class="hp-bar"><div class="hp-fill"></div><div class="hp-text"></div></div></div>';
    setHpBar(div.querySelector(".hp-fill"), div.querySelector(".hp-text"), p.hp, START_HP);
    div.id = "pcard-"+i;
    grid.appendChild(div);
  });
}

function renderAll(){
  renderTopbar();
  renderBossZone();
  renderTable();
  renderPlayers();
  if(state.phase==="pvp") renderDuelZone();
}

/* ============================================================
   ТАЙМЕР ОТВЕТА
   ============================================================ */
let timerId = null, timeLeft = 0;
function startTimer(){
  stopTimer();
  timeLeft = ANSWER_TIME;
  $("q-timer").textContent = timeLeft;
  $("q-timer").classList.remove("low");
  $("q-timer").classList.remove("hidden");
  $("q-timer-label").classList.remove("hidden");
  timerId = setInterval(()=>{
    timeLeft--;
    $("q-timer").textContent = Math.max(0,timeLeft);
    if(timeLeft<=5 && timeLeft>0) sfx.tick();
    if(timeLeft<=5) $("q-timer").classList.add("low");
    if(timeLeft<=0){
      stopTimer();
      onTimeUp();
    }
  }, 1000);
}
function stopTimer(){
  if(timerId!==null){ clearInterval(timerId); timerId = null; }
}
function hideTimer(){
  stopTimer();
  $("q-timer").classList.add("hidden");
  $("q-timer-label").classList.add("hidden");
}

/* ============================================================
   ИГРОВОЙ ПОТОК
   ============================================================ */
function nextTurn(){
  $("q-overlay").classList.remove("show");
  hideTimer();
  // ---- условия завершения ----
  if(state.phase==="boss" && state.boss.hp<=0){ bossDefeated(); return; }
  if(state.phase==="pvp" && alivePlayers().length<=3){ finishGame("last3"); return; }
  if(alivePlayers().length===0){ finishGame("wipe"); return; }
  if(allDecksEmpty()){ finishGame("exhausted"); return; }   // вопросы закончились — финал!

  // берём следующего живого игрока из очереди
  let idx = null;
  while(state.queuePos < state.queue.length){
    const cand = state.queue[state.queuePos];
    state.queuePos++;
    if(state.players[cand].alive){ idx = cand; break; }
  }
  if(idx===null){ // круг окончен — новый раунд
    state.round++;
    newRound();
    idx = state.queue[0]; state.queuePos = 1;
  }

  if(state.phase==="pvp"){
    const targets = alivePlayers().filter(p=>p.id!==idx);
    if(targets.length===0){ finishGame("last3"); return; }
    const target = targets[Math.floor(Math.random()*targets.length)];
    state.current = {attackerIdx:idx, targetIdx:target.id, mega:false, answered:false};
  }else{
    state.current = {attackerIdx:idx, targetIdx:null, mega:false, answered:false};
  }
  sfx.flip();
  renderAll();
}

function pickTopic(topicIdx){
  if(!state.current) return;
  const drawn = drawQuestion(topicIdx);
  if(!drawn){ toast("В этой колоде карты кончились!"); renderTable(); return; }
  const q = drawn.q;
  const at = state.players[state.current.attackerIdx];
  const tg = state.current.targetIdx!==null ? state.players[state.current.targetIdx] : null;

  // ---- мегавопрос: один раз за игру, без таймера ----
  const mega = !state.megaUsed && Math.random() < MEGA_CHANCE;
  if(mega){ state.megaUsed = true; }
  state.current.mega = mega;
  state.current.answered = false;
  state.current.q = q;

  const dmgShown = mega ? MEGA_DMG : DMG[q.difficulty];
  $("q-topic").textContent = TOPICS[topicIdx].emoji + " " + TOPICS[topicIdx].name;
  $("q-diff").innerHTML = mega
    ? '<span style="color:#ff6b5e;">☠ МЕГА</span> <span class="dmg-note">урон '+MEGA_DMG+'</span>'
    : "★".repeat(q.difficulty) + ' <span class="dmg-note">урон '+dmgShown+'</span>';
  $("q-mega-label").classList.toggle("hidden", !mega);
  $("q-card").classList.toggle("mega", mega);
  $("q-for").innerHTML = state.phase==="boss"
    ? "Отвечает: <b>"+esc(at.name)+"</b>"
    : "<b>"+esc(at.name)+"</b> ⚔ <b>"+esc(tg.name)+"</b>";
  $("q-text").textContent = q.text;

  // ---- варианты ответа в случайном порядке ----
  const variants = shuffle(q.options.map((text,origIdx)=>({text, correct:origIdx===q.answer})));
  state.current.answerIdx = variants.findIndex(v=>v.correct);
  const opts = $("q-opts");
  opts.innerHTML = "";
  const letters = ["А","Б","В","Г"];
  variants.forEach((v,i)=>{
    const b = document.createElement("button");
    b.className = "q-opt";
    b.innerHTML = '<span class="letter">'+letters[i]+'</span><span>'+esc(v.text)+'</span>';
    b.onclick = ()=>answer(i);
    opts.appendChild(b);
  });
  $("q-next").classList.add("hidden");
  $("q-overlay").classList.add("show");
  if(mega){ hideTimer(); } else { startTimer(); }
}

function answer(chosen){
  if(!state.current || state.current.answered) return;
  state.current.answered = true;
  stopTimer();
  const correct = chosen===state.current.answerIdx;
  const btns = $("q-opts").querySelectorAll(".q-opt");
  btns.forEach((b,i)=>{
    b.classList.add("disabled");
    if(i===state.current.answerIdx) b.classList.add("correct");
    if(i===chosen && !correct) b.classList.add("wrong");
  });
  if(correct) resolveCorrect(); else resolveWrong(null);
}

function onTimeUp(){
  if(!state.current || state.current.answered) return;
  state.current.answered = true;
  const btns = $("q-opts").querySelectorAll(".q-opt");
  btns.forEach((b,i)=>{
    b.classList.add("disabled");
    if(i===state.current.answerIdx) b.classList.add("correct");
  });
  resolveWrong('<span class="t-bad">⏰ Время вышло!</span>');
}

function resolveCorrect(){
  const mega = state.current.mega;
  const dmg = mega ? MEGA_DMG : DMG[state.current.q.difficulty];
  const at = state.players[state.current.attackerIdx];
  at.answers++; at.correct++;
  if(state.phase==="boss"){
    const d = Math.min(dmg, state.boss.hp);
    state.boss.hp -= dmg;
    at.dmgBoss += d; at.dmgDealt += d;
    sfx.correct(); sfx.hit(); if(mega) sfx.mega();
    toast(mega
      ? '<span class="t-bad">🔥 МЕГАВОПРОС!</span> Босс теряет <b>'+dmg+'</b> HP!'
      : '<span class="t-good">✔ Верно!</span> '+esc(at.name)+' наносит БОССУ <b>'+dmg+'</b> урона');
    floatDamage($("boss-zone"), "-"+dmg, mega ? "dmg-red" : "dmg-green");
    $("boss-zone").classList.add("shake");
    setTimeout(()=>$("boss-zone").classList.remove("shake"), 550);
    renderBossZone();
  }else{
    const tg = state.players[state.current.targetIdx];
    const d = Math.min(dmg, tg.hp);
    tg.hp -= dmg; tg.dmgTaken += dmg;
    at.dmgDealt += d;
    tg.killedBy = tg.hp<=0 ? at.name : tg.killedBy;
    sfx.correct(); sfx.hit(); if(mega) sfx.mega();
    toast(mega
      ? '<span class="t-bad">🔥 МЕГАВОПРОС!</span> '+esc(tg.name)+' теряет <b>'+dmg+'</b> HP!'
      : '<span class="t-good">✔ Верно!</span> '+esc(at.name)+' бьёт '+esc(tg.name)+' на <b>'+dmg+'</b> урона');
    floatDamage($("pcard-"+tg.id), "-"+dmg, "dmg-red");
    $("pcard-"+tg.id).classList.add("shake");
    setTimeout(()=>$("pcard-"+tg.id)?.classList.remove("shake"), 550);
    checkPlayerDead(tg, at.name);
    renderPlayers(); renderDuelZone();
  }
  $("q-next").classList.remove("hidden");
}

function resolveWrong(prefix){
  const mega = state.current.mega;
  const dmg = mega ? MEGA_DMG : DMG[state.current.q.difficulty];
  const at = state.players[state.current.attackerIdx];
  at.answers++;
  at.hp -= dmg; at.dmgTaken += dmg;
  sfx.wrong(); sfx.hit(); if(mega) sfx.mega();
  toast((prefix || '<span class="t-bad">✘ Неверно…</span>')+' '+esc(at.name)+' получает <b>'+dmg+'</b> урона');
  floatDamage($("pcard-"+at.id), "-"+dmg, "dmg-red");
  $("pcard-"+at.id).classList.add("shake");
  setTimeout(()=>$("pcard-"+at.id)?.classList.remove("shake"), 550);
  checkPlayerDead(at, null);
  renderPlayers();
  if(state.phase==="pvp") renderDuelZone();
  $("q-next").classList.remove("hidden");
}

function checkPlayerDead(p){
  if(p.hp<=0 && p.alive){
    p.alive = false; p.hp = 0;
    p.eliminatedIn = state.phase==="boss" ? "I" : "II";
    sfx.die();
    setTimeout(()=>toast('<span class="t-bad">☠ '+esc(p.name)+' выбывает!</span>'), 700);
  }
}

function bossDefeated(){
  const killer = state.players[state.current.attackerIdx];
  state.bossKiller = killer.id;
  killer.points += BOSS_KILL_BONUS;
  sfx.win();
  showBanner("🏆", "БОСС ПОВЕРЖЕН!",
    esc(killer.name)+" <b style='color:var(--gold)'>+"+BOSS_KILL_BONUS+"</b>",
    ()=>{
      state.phase = "pvp";
      state.round = 1;
      newRound();
      $("boss-zone").classList.add("hidden");
      $("duel-zone").classList.remove("hidden");
      $("duel-zone").style.display = "flex";
      nextTurn();
    });
}

/* ---- завершение игры ---- */
function finishGame(reason){
  stopTimer();
  state.phase = "end";
  state.finishReason = reason;
  // "last3" — остаются трое, места по урону; "exhausted"/"wipe" — карты кончились или экипаж пал:
  // места по нанесённому урону, затем по запасу HP
  const pool = (reason==="exhausted" || reason==="wipe")
    ? state.players
    : state.players.filter(p=>p.alive);
  const finalists = pool.slice().sort((a,b)=> b.dmgDealt-a.dmgDealt || b.hp-a.hp);
  finalists.slice(0, PRIZE.length).forEach((p,i)=>{ p.points += PRIZE[i]; });
  sfx.win();
  renderResults(finalists);
  $("screen-game").classList.add("hidden");
  $("screen-results").classList.remove("hidden");
}

/* ============================================================
   ИТОГИ
   ============================================================ */
function renderResults(finalists){
  const medals = ["🥇","🥈","🥉"];
  $("results-sub").textContent = "";

  const pod = $("podium");
  pod.innerHTML = "";
  finalists.slice(0,3).forEach((p,i)=>{
    const d = document.createElement("div");
    d.className = "card";
    d.innerHTML = '<div class="medal">'+medals[i]+'</div><div style="font-size:40px;">'+p.avatar.emoji+'</div><div class="p-nick">'+esc(p.name)+'</div>'+
      '<div class="p-pts">+'+PRIZE[i]+'</div>';
    pod.appendChild(d);
  });
  if(state.bossKiller!==null){
    const k = state.players[state.bossKiller];
    const d = document.createElement("div");
    d.className = "card";
    d.innerHTML = '<div class="medal">💀</div><div style="font-size:40px;">'+k.avatar.emoji+'</div><div class="p-nick">'+esc(k.name)+'</div>'+
      '<div class="p-pts"><span class="badge-boss">ДОБИЛ БОССА</span><br>+'+BOSS_KILL_BONUS+'</div>';
    pod.appendChild(d);
  }

  const rows = state.players.slice().sort((a,b)=> b.points-a.points || b.dmgDealt-a.dmgDealt);
  let html = "<tr><th>Место</th><th>Игрок</th><th>Очки</th><th>Статус</th><th>Урон боссу</th><th>Урон игрокам</th><th>Всего урона</th><th>Получено</th><th>Ответы</th></tr>";
  rows.forEach((p,i)=>{
    const dmgPvp = p.dmgDealt - p.dmgBoss;
    const status = p.alive ? '<span style="color:var(--emerald)">Выжил</span>'
      : 'Выбыл (глава '+p.eliminatedIn+')'+(p.killedBy?'<br><span style="font-size:12px; color:var(--muted)">от '+esc(p.killedBy)+'</span>':'');
    html += "<tr class='"+(p.alive?"":"dead-row")+"'>"+
      "<td class='place'>"+(i+1)+"</td>"+
      "<td class='name'>"+p.avatar.emoji+" "+esc(p.name)+(state.bossKiller===p.id?' <span class="badge-boss">💀 босс</span>':'')+"</td>"+
      "<td><b>"+p.points+"</b></td><td>"+status+"</td>"+
      "<td>"+p.dmgBoss+"</td><td>"+Math.max(0,dmgPvp)+"</td><td>"+p.dmgDealt+"</td><td>"+p.dmgTaken+"</td>"+
      "<td>"+p.correct+" / "+p.answers+"</td></tr>";
  });
  $("stats-table").innerHTML = html;
}

/* ============================================================
   УВЕДОМЛЕНИЯ / БАННЕРЫ / ЭФФЕКТЫ
   ============================================================ */
let toastTimer = null;
function toast(html, ms=2600){
  const t = $("toast");
  t.innerHTML = html;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), ms);
}
function floatDamage(targetEl, text, cls){
  if(!targetEl) return;
  const rect = targetEl.getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "p-damage-pop "+cls;
  el.textContent = text;
  el.style.left = (rect.left + rect.width/2 - 18 + (Math.random()*30-15)) + "px";
  el.style.top  = (rect.top + 6) + "px";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1350);
}
function showBanner(emoji, title, text, onBtn){
  $("banner-emoji").textContent = emoji;
  $("banner-title").textContent = title;
  $("banner-text").innerHTML = text;
  $("banner-btn").onclick = ()=>{ $("banner-overlay").classList.remove("show"); onBtn(); };
  $("banner-overlay").classList.add("show");
}

/* ============================================================
   СТАРТ / UI
   ============================================================ */
function buildSetup(){
  const grid = $("nick-grid");
  grid.innerHTML = "";
  for(let i=0;i<10;i++){
    const slot = document.createElement("div");
    slot.className = "nick-slot";
    const av = AVATARS[i];
    slot.innerHTML = '<span class="avatar" style="background:'+av.color+';" title="'+esc(av.name)+'">'+av.emoji+'</span>'+
      '<input id="nick-'+i+'" maxlength="14" placeholder="Игрок '+(i+1)+'">';
    grid.appendChild(slot);
  }
}
$("start-btn").onclick = ()=>{
  const names = [];
  for(let i=0;i<10;i++){
    const v = $("nick-"+i).value.trim();
    names.push(v || "Игрок "+(i+1));
  }
  const seen = {};
  for(let i=0;i<names.length;i++){
    if(seen[names[i]]){ let k=2; while(seen[names[i]+" ("+k+")"]) k++; names[i]=names[i]+" ("+k+")"; }
    seen[names[i]] = true;
  }
  newGame(names);
  // сброс игрового экрана от прошлой партии (иначе сразу откроется Глава II)
  $("boss-zone").classList.remove("hidden");
  $("duel-zone").classList.add("hidden");
  $("duel-zone").style.display = "none";
  $("boss-emoji").textContent = "👹";
  $("boss-name").textContent = "ТЁМНЫЙ ВЛАДЫКА";
  $("screen-setup").classList.add("hidden");
  $("screen-results").classList.add("hidden");
  $("screen-game").classList.remove("hidden");
  nextTurn();
};
$("q-next").onclick = nextTurn;
$("again-btn").onclick = ()=>{
  $("screen-results").classList.add("hidden");
  $("screen-setup").classList.remove("hidden");
};
$("mute-btn").onclick = ()=>{
  muted = !muted;
  $("mute-btn").textContent = muted ? "🔇 Звук" : "🔊 Звук";
};
buildSetup();
</script>
